name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install ruff pyyaml

      - name: Validate Python syntax
        run: python -m py_compile .\njupt-paper-access\scripts\njupt_paper.py

      - name: Validate skill metadata
        run: python .\.github\scripts\validate_skill.py

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Parse PowerShell
        shell: pwsh
        run: .\.github\scripts\check_powershell.ps1

      - name: Smoke test
        run: python .\njupt-paper-access\scripts\njupt_paper.py resolve 10.1109/TAC.2021.3105491
